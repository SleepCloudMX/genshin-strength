<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>星扩散直伤：精通和双暴的词条分配</title>
<link rel="icon" type="image/png" href="https://sleepcloudmx.github.io/Others/Image/kenomimi.png">
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
<style>
  :root { --ink:#222; --muted:#555; --line:#d8d8d8; --bg:#fafafa; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px 24px 40px; background: #fff; color: var(--ink);
    font-family: "Microsoft YaHei", "SimHei", system-ui, sans-serif;
  }
  h1 { font-size: 19px; margin: 0; }
  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 4px; font-size: 13px; }
  .repo { color: var(--muted); text-decoration: none; white-space: nowrap; }
  .repo:hover { color: var(--ink); text-decoration: underline; }
  .repo svg { width: 1.15em; height: 1.15em; fill: currentColor; vertical-align: -0.18em; margin-right: 4px; }
  .repo-line { margin-top: 8px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }

    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;

    display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: flex-end;
  }
  .panel-note { flex-basis: 100%; font-size: 13px; color: var(--muted); }

  label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  input {
    font: inherit; font-size: 14px; color: var(--ink); width: 110px;

  }
  input[type=text] { width: 190px; }

  .plot { width: 100%; }
  footer {
    margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--line);
    font-size: 12px; color: var(--muted); line-height: 1.7;
  }
</style>

<body>

<div class="head">
<h1>星扩散直伤：精通和双暴的词条分配</h1>
<a class="repo" href="https://github.com/SleepCloudMX/genshin-strength" target="_blank" rel="noreferrer"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>GitHub</a>
</div>
<div class="sub">悬浮曲线上任意位置可看该点的面板与相对伤害。改下面任意一项，三张图即时重算。</div>

<div class="panel">
  <div class="panel-note"><b>基准面板 = 上完 buff、不含副词条</b> —— 副词条正是这里要分配的东西。</div>
  <label>基准精通（不含副词条）<input id="em" type="number" step="1"></label>
  <label>基准暴击率 %<input id="cr" type="number" step="0.1"></label>
  <label>基准暴伤 %<input id="cd" type="number" step="0.1"></label>
  <div class="derived">双暴分 <b id="score"></b></div>
  <label>星扩散增伤 %<input id="bonus" type="number" step="1"></label>
  <label>曲线取哪些 n<input id="ns" type="text"></label>
  <label>平台阈值 %<input id="level" type="number" step="0.5"></label>
</div>

<div id="figA" class="plot"></div>
<div id="figB" class="plot"></div>

<footer>
  基准面板只填<b>上完 buff、不含圣遗物副词条</b>的部分 —— 主词条、武器、天赋、队友给的都算在基准里；只有副词条参与分配。<br>
  1 等效词条 = 20 精通 = 3.3% 暴击 = 6.6% 暴伤。算的是<b>星扩散直伤</b>（瑞希天赋「廓然梦生」的精通倍率伤害），不是反应星扩散。
  <div class="repo-line">源码与说明：<a class="repo" href="https://github.com/SleepCloudMX/genshin-strength" target="_blank" rel="noreferrer"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>GitHub</a></div>
</footer>

<script>
// ── 游戏规则常数（与 tasks/mizuki/em_vs_crit.py 一一对应，改公式必须同时改两边）──
const EM_COEF = 6.0;        // 星扩散的精通系数。传统剧变反应是 16，别写错
const EM_OFFSET = 2000.0;
const EM_PER_ROLL = 20.0;   // 1 等效词条
const CR_PER_ROLL = 3.3;
const CD_PER_ROLL = 6.6;

// ── 初始基准面板（页面上可改）──
const DEFAULTS = { em: 951, cr: 36, cd: 112.2, bonus: 1.40, ns: [15, 20, 25, 30, 35], level: 0.99 };

// 曲线配色：viridis_r 在 [0.28, 1.0] 上取 11 个采样点 —— 从 0.28 起是为了
// 避开最浅的亮黄，白底上看不清词条最少的那条曲线。
const RAMP = ['#4ec36b', '#2eb37c', '#1fa287', '#20928c', '#27808e', '#2e6f8e',
              '#365c8d', '#3f4889', '#46327e', '#481b6d', '#440154'];

// ── 游戏公式 ──
const emTerm = (em) => EM_COEF * em / (em + EM_OFFSET);

/** b 个双暴词条在暴击率与暴伤之间最优拆分后的配比。 */
function allocAt(b, cr0, cd0) {
  const aStar = b / 2 + (cd0 / CD_PER_ROLL - cr0 / CR_PER_ROLL) / 2;
  const a = Math.min(Math.max(aStar, 0), b, (100 - cr0) / CR_PER_ROLL);
  return { a, cr: cr0 + CR_PER_ROLL * a, cd: cd0 + CD_PER_ROLL * (b - a) };
}
const critZoneAt = (b, cr0, cd0) => {
  const { cr, cd } = allocAt(b, cr0, cd0);
  return 1 + (cr / 100) * (cd / 100);
};

/** n 个等效词条中给双暴 b 个时的星扩散直伤（任意单位，只用于比较）。 */
function damage(s, n, b) {
  const em = EM_PER_ROLL * (n - b) + s.em;
  return em * (1 + s.bonus + emTerm(em)) * critZoneAt(b, s.cr, s.cd);
}

/** 黄金分割搜索最大值。 */
function bestSplit(s, n) {
  const phi = 0.6180339887;
  const f = (b) => damage(s, n, b);
  let lo = 0, hi = n;
  let a = hi - phi * (hi - lo), b2 = lo + phi * (hi - lo);
  let fa = f(a), fb = f(b2);
  for (let i = 0; i < 80 && hi - lo > 1e-7; i++) {
    if (fa > fb) { hi = b2; b2 = a; fb = fa; a = hi - phi * (hi - lo); fa = f(a); }
    else { lo = a; a = b2; fa = fb; b2 = lo + phi * (hi - lo); fb = f(b2); }
  }
  const b = (lo + hi) / 2;
  return { b, f: f(b) };
}

/** 伤害不低于 level × fmax 的双暴词条区间。假定曲线单峰。 */
function plateau(s, n, fmax, level) {
  // 格子随 n 加密，保证步长不超过 0.025 词条 —— 否则 n 填大时
  // 平台上标出的「N.N 词」会偏粗（Python 那边用固定 4001 格）。
  const steps = Math.max(800, Math.ceil(n * 40));
  let lo = null, hi = null;
  for (let i = 0; i <= steps; i++) {
    const b = n * i / steps;
    if (damage(s, n, b) >= level * fmax) { if (lo === null) lo = b; hi = b; }
  }
  return { lo, hi };
}

/** 在配色带上按 t∈[0,1] 取色。 */
function ramp(t) {
  const x = Math.min(Math.max(t, 0), 1) * (RAMP.length - 1);
  const i = Math.min(Math.floor(x), RAMP.length - 2), k = x - i;
  const at = (hex, j) => parseInt(hex.slice(1 + 2 * j, 3 + 2 * j), 16);
  const mix = (j) => Math.round(at(RAMP[i], j) + (at(RAMP[i + 1], j) - at(RAMP[i], j)) * k);
  return `rgb(${mix(0)},${mix(1)},${mix(2)})`;
}

// ── 状态 ──
const $ = (id) => document.getElementById(id);
const num = (id, fallback) => {
  const v = parseFloat($(id).value);
  return Number.isFinite(v) ? v : fallback;
};
const parseNs = () => $('ns').value.split(/[,，\s]+/)
  .map((s) => parseFloat(s)).filter((v) => Number.isFinite(v) && v > 1)
  .sort((a, b) => a - b).slice(0, 10);

function readState() {
  return {
    em: num('em', DEFAULTS.em),
    cr: num('cr', DEFAULTS.cr),
    cd: num('cd', DEFAULTS.cd),
    bonus: num('bonus', DEFAULTS.bonus * 100) / 100,
    ns: parseNs(),
    level: num('level', DEFAULTS.level * 100) / 100,
  };
}

// ── 绘制 ──
const SAMPLES = 401;

function buildA(s) {
  const traces = [], annos = [];
  const ns = s.ns.length ? s.ns : DEFAULTS.ns;
  const span = Math.max(...ns);

  ns.forEach((n, i) => {
    const color = ramp(i / Math.max(ns.length - 1, 1));
    const base = damage(s, n, 0);
    const { b: bStar, f: fMax } = bestSplit(s, n);
    const { lo, hi } = plateau(s, n, fMax, s.level);

    const xs = [], ys = [], cd = [];
    for (let k = 0; k <= SAMPLES; k++) {
      const b = n * k / SAMPLES;
      const v = damage(s, n, b);
      const { cr, cd: cdmg } = allocAt(b, s.cr, s.cd);
      xs.push(b); ys.push(v / base);
      cd.push([n, b, n - b, cr, cdmg, EM_PER_ROLL * (n - b) + s.em,
               v / base, 100 * v / fMax]);
    }

    traces.push({
      type: 'scatter', mode: 'lines', x: xs, y: ys, customdata: cd,
      name: `共 ${n} 词条`, line: { color, width: 2.2 }, hoverinfo: 'text',
      hovertemplate:
        `共 %{customdata[0]} 词条　双暴 %{customdata[1]:.1f} · 精通 %{customdata[2]:.1f}<br>` +
        `暴击率 %{customdata[3]:.1f}%　暴伤 %{customdata[4]:.1f}%<br>` +
        `精通 %{customdata[5]:.0f}　伤害 ×%{customdata[6]:.4f}<br>` +
        `该曲线最大值的 %{customdata[7]:.1f}%<extra></extra>`,
    });

    if (lo !== null) {
      traces.push({
        type: 'scatter', mode: 'lines', x: [lo, hi],
        y: [damage(s, n, lo) / base, damage(s, n, hi) / base],
        line: { color, width: 1.4, dash: 'dash' }, hoverinfo: 'skip', showlegend: false,
      });
      for (const x of [lo, hi]) {
        traces.push({
          type: 'scatter', mode: 'markers', x: [x], y: [damage(s, n, x) / base],
          marker: { color, size: 8, line: { color: '#fff', width: 1.2 } },
          hoverinfo: 'skip', showlegend: false,
        });
      }
    }
    traces.push({
      type: 'scatter', mode: 'markers', x: [bStar], y: [fMax / base],
      marker: { color, size: 9, symbol: 'diamond', line: { color: '#fff', width: 1.2 } },
      hoverinfo: 'skip', showlegend: false,
    });

    const common = {
      showarrow: false, font: { size: 12, color },
      bgcolor: 'rgba(255,255,255,0.82)', borderpad: 2,
    };
    annos.push({ ...common, x: bStar, y: fMax / base, xshift: 7, yshift: 2,
                 xanchor: 'left', yanchor: 'bottom',
                 text: `×${bStar.toFixed(1)} (${(fMax / base).toFixed(3)})` });
    if (lo !== null) {
      for (const x of [lo, hi]) {
        annos.push({ ...common, x, y: damage(s, n, x) / base, xshift: 0, yshift: -15,
                     xanchor: 'center', yanchor: 'top', font: { size: 11, color },
                     text: `${x.toFixed(1)} 词` });
      }
    }
  });

  return {
    traces, layout: {
      title: { text: '相对「词条全给精通」的伤害倍数', font: { size: 14 } },
      xaxis: { title: { text: '给双暴的等效词条数（其余给精通）' }, range: [0, span],
               zeroline: false, gridcolor: '#e8e8e8' },
      yaxis: { title: { text: '星扩散直伤倍数' }, gridcolor: '#e8e8e8' },
      shapes: [{ type: 'line', x0: 0, x1: span, y0: 1, y1: 1,
                 line: { color: '#999', width: 1.2, dash: 'dot' } }],
      annotations: annos,
      legend: { x: 0.01, y: 0.99, bgcolor: 'rgba(255,255,255,0.9)' },
      margin: { t: 44, r: 24, b: 52, l: 66 }, height: 520,
      hovermode: 'closest', plot_bgcolor: '#fff', paper_bgcolor: '#fff',
    },
  };
}

function buildB(s) {
  const steps = 121, lo0 = 5, hi0 = Math.max(45, ...(s.ns.length ? s.ns : DEFAULTS.ns));
  const ns = [], bs = [], los = [], his = [], ems = [], crs = [], cds = [];
  for (let i = 0; i <= steps; i++) {
    const n = lo0 + (hi0 - lo0) * i / steps;
    const { b: bStar, f: fMax } = bestSplit(s, n);
    const { lo, hi } = plateau(s, n, fMax, s.level);
    ns.push(n); bs.push(bStar); los.push(lo); his.push(hi);
    const { cr, cd } = allocAt(bStar, s.cr, s.cd);
    ems.push(EM_PER_ROLL * (n - bStar) + s.em);
    crs.push(cr); cds.push(cd);
  }

  const traces = [
    { type: 'scatter', mode: 'lines', x: ns, y: his, showlegend: false,
      line: { color: 'rgba(220,20,60,0)' }, hoverinfo: 'skip' },
    { type: 'scatter', mode: 'lines', x: ns, y: los,
      name: `${(s.level * 100).toFixed(0)}% 平台`,
      fill: 'tonexty', fillcolor: 'rgba(220,20,60,0.16)',
      line: { color: 'rgba(220,20,60,0)' }, hoverinfo: 'skip' },
    { type: 'scatter', mode: 'lines', x: ns, y: bs, name: '最优双暴词条数（图 A 的 ×）',
      line: { color: '#000', width: 2.6 } },
    { type: 'scatter', mode: 'lines', x: ns, y: ns, name: '全部词条给双暴',
      line: { color: '#999', width: 1.4, dash: 'dash' } },
    { type: 'scatter', mode: 'lines', x: ns, y: ems, name: '元素精通',
      line: { color: '#2e8b57', width: 2.2 }, xaxis: 'x2', yaxis: 'y2' },
    { type: 'scatter', mode: 'lines', x: ns, y: crs, name: '暴击率',
      line: { color: '#d62728', width: 2.2 }, xaxis: 'x2', yaxis: 'y3' },
    { type: 'scatter', mode: 'lines', x: ns, y: cds, name: '暴伤',
      line: { color: '#ff7f0e', width: 2.2, dash: 'dash' }, xaxis: 'x2', yaxis: 'y3' },
  ];

  return {
    traces, layout: {
      grid: { rows: 2, columns: 1, pattern: 'independent', roworder: 'top to bottom' },
      xaxis: { title: { text: '等效词条总数 n' }, gridcolor: '#e8e8e8' },
      yaxis: { title: { text: '给双暴的等效词条数' }, gridcolor: '#e8e8e8' },
      xaxis2: { title: { text: '等效词条总数 n' }, gridcolor: '#e8e8e8' },
      yaxis2: { title: { text: '元素精通' }, titlefont: { color: '#2e8b57' },
                tickfont: { color: '#2e8b57' }, gridcolor: '#e8e8e8' },
      yaxis3: { title: { text: '暴击率 / 暴伤 %' }, overlaying: 'y2', side: 'right',
                showgrid: false },
      legend: { x: 0.01, y: 0.99, bgcolor: 'rgba(255,255,255,0.9)' },
      margin: { t: 28, r: 70, b: 52, l: 70 }, height: 620,
      hovermode: 'closest', plot_bgcolor: '#fff', paper_bgcolor: '#fff',
    },
  };
}

// ── 主循环 ──
function render() {
  const s = readState();
  $('score').textContent = (2 * s.cr + s.cd).toFixed(1);
  const a = buildA(s), b = buildB(s);
  Plotly.react('figA', a.traces, a.layout, { responsive: true });
  Plotly.react('figB', b.traces, b.layout, { responsive: true });
}

$('em').value = DEFAULTS.em;
$('cr').value = DEFAULTS.cr;
$('cd').value = DEFAULTS.cd;
$('bonus').value = (DEFAULTS.bonus * 100).toFixed(0);
$('ns').value = DEFAULTS.ns.join(', ');
$('level').value = (DEFAULTS.level * 100).toFixed(0);

for (const el of document.querySelectorAll('input')) el.addEventListener('input', render);
render();
</script>
</body>
</html>
